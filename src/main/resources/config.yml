# Как часто обновлять скорборд (в тиках, 20 = 1 секунда)
update-ticks: 20

title: "&#FFB020&lГРИФ #1"

no-clan: "Без клана"
default-rank: "&7Игрок"
start-elo: 1000

# Ранги проверяются сверху вниз, первый подходящий по праву показывается.
# Если используешь LuckPerms — права вида group.<имя группы>
ranks:
  dragon:
    permission: "group.dragon"
    display: "&d◆ &f&l[DRAGON]"
  vip:
    permission: "group.vip"
    display: "&a&l[VIP]"

# Плейсхолдеры: {player} {rank} {clan} {kills} {deaths} {elo}
#               {balance} {pillikov} {romashki} {ping}
# Цвета: &-коды и &#RRGGBB
lines:
  - ""
  - "&6▎ &fНик: &#FF6B3D{player}"
  - "&6▎ &fРанг: {rank}"
  - "&6▎ &fКлан: &#FF6B3D{clan}"
  - "&6▎ &fУ/С: &#FF6B3D{kills}/{deaths}"
  - "&6▎ &fELO: &#FF6B3D{elo}"
  - ""
  - "&6▎ &fБаланс: &#FF6B3D{balance} &a⬤"
  - "&6▎ &fПилликов: &#FF6B3D{pillikov} &6⬤"
  - "&6▎ &fРомашки: &#FF6B3D{romashki} &d⬤"
  - ""
  - "&6● &fПинг: &#FF6B3D{ping} &bмс"
  - ""
  - "&#FF4D2E&lGhostGrief.pw"
  - ""
